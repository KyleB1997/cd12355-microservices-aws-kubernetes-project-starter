apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
spec:
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: 372385315342.dkr.ecr.us-east-1.amazonaws.com/myapp:latest
        imagePullPolicy: Always
        env:
        - name: DB_NAME
          value: mydatabase
        - name: DB_USERNAME
          value: myuser
        - name: DB_PASSWORD
          value: mypassword
        ports:
        - containerPort: 5153
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgresql-storage
      volumes:
      - name: postgresql-storage
        persistentVolumeClaim:
          claimName: postgresql-pvc